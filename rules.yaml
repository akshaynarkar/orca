- id: CMP-08
  name: "Insider conviction low"
  category: composite
  color: GREEN
  base_strength: 90
  rarity: 98
  condition: "fired('INS-05') and fired('PRC-01') and fired('MAC-03')"
  description: "Insider buy near 52-week low + deep drawdown + VIX spike"
  enabled: true
