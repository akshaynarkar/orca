  color: GREEN
  base_strength: 85
  rarity: 95
  condition: "fired('PRC-05') and fired('PRC-09') and fired('FUN-01')"
  description: "New 52-week high + golden cross + sustained revenue growth"
  enabled: true
  validity_period: 7
